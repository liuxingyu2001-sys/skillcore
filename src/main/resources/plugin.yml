name: SkillCore
version: '${project.version}'
main: com.skillcore.SkillCorePlugin
api-version: '1.21'
folia-supported: false
authors: [SkillCore]
description: Skill weapon plugin - skills are bound to weapons. Hold the weapon to use its skill.
softdepend: [PlaceholderAPI, CraftEngine, packetevents]

commands:
  skillcore:
    description: SkillCore main command
    aliases: [sc, skillweapon]
    permission: skillcore.admin

permissions:
  skillcore.admin:
    description: Admin access to SkillCore
    default: op
  skillcore.bypass.cooldown:
    description: Bypass skill weapon cooldowns (仅当 config.yml 开启 cooldown.bypass-permission 才生效)
    default: false
