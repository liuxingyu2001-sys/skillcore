# SkillCore skill definitions
# Factory pattern: each section becomes a Skill instance via SkillFactory.
#
# Type fields:
#   type: ACTIVE | PASSIVE | ULTIMATE | TOGGLE
#   trigger: LEFT_CLICK | RIGHT_CLICK | SHIFT_LEFT_CLICK | SHIFT_RIGHT_CLICK | BOTH_CLICK | COMMAND
#   skill-type: (optional) custom constructor key registered in SkillFactory
#
# Damage profile:
#   base / scaling / critical-chance / critical-multiplier / armor-penetration
#   percent-max-health / percent-current-health / percent-missing-health / max-percent-damage

skills:
  # ---------------------------------------------------------------
  # 基础攻击技能
  # ---------------------------------------------------------------
  power_strike:
    display-name: "&c强力打击"
    description: "&7挥出强力一击，造成物理伤害"
    type: ACTIVE
    trigger: RIGHT_CLICK
    cooldown: 3.0
    mana-cost: 10
    icon: IRON_SWORD
    lore:
      - "&7基础伤害 + 力量加成"
      - "&8冷却: 3s"
    damage:
      base: 8.0
      scaling: 1.5
      critical-chance: 0.15
      critical-multiplier: 1.8
      armor-penetration: 0.1

  # ---------------------------------------------------------------
  # 百分比伤害技能
  # ---------------------------------------------------------------
  life_rend:
    display-name: "&5生命撕裂"
    description: "&7对目标造成其最大生命值 8% 的伤害"
    type: ACTIVE
    trigger: SHIFT_RIGHT_CLICK
    cooldown: 8.0
    mana-cost: 25
    icon: NETHERITE_SWORD
    damage:
      base: 2.0
      percent-max-health: 0.08
      max-percent-damage: 40.0
      armor-penetration: 0.3

  execute:
    display-name: "&c处决"
    description: "&7对低血量目标造成已损生命值 35% 的额外伤害"
    type: ACTIVE
    trigger: LEFT_CLICK
    cooldown: 12.0
    mana-cost: 30
    icon: GOLDEN_SWORD
    damage:
      base: 4.0
      percent-missing-health: 0.35
      max-percent-damage: 80.0
      armor-penetration: 0.5

  # ---------------------------------------------------------------
  # 吸血技能
  # ---------------------------------------------------------------
  vampiric_strike:
    display-name: "&4吸血打击"
    description: "&7造成伤害并回复 30% 所造成伤害的生命"
    type: ACTIVE
    trigger: RIGHT_CLICK
    cooldown: 5.0
    mana-cost: 15
    icon: REDSTONE
    damage:
      base: 6.0
      scaling: 1.2
      critical-chance: 0.1
      critical-multiplier: 1.5
    lifesteal: 0.30

  # ---------------------------------------------------------------
  # 反伤（被动示例 - 通过 CombatListener 配置）
  # ---------------------------------------------------------------
  thorns_aura:
    display-name: "&6荆棘光环"
    description: "&7受到攻击时反弹 20% 伤害给攻击者"
    type: PASSIVE
    trigger: COMMAND
    cooldown: 0
    mana-cost: 0
    icon: IRON_CHESTPLATE
    skill-type: THORNS

  # ---------------------------------------------------------------
  # 位移技能
  # ---------------------------------------------------------------
  shadow_dash:
    display-name: "&9暗影冲刺"
    description: "&7向前快速冲刺"
    type: ACTIVE
    trigger: SHIFT_LEFT_CLICK
    cooldown: 4.0
    mana-cost: 12
    icon: FEATHER
    skill-type: DASH
    dash-speed: 1.8
    dash-y: 0.25

  blink:
    display-name: "&b闪现"
    description: "&7瞬间传送到前方 8 格"
    type: ACTIVE
    trigger: RIGHT_CLICK
    cooldown: 10.0
    mana-cost: 20
    icon: ENDER_PEARL
    skill-type: BLINK
    blink-distance: 8.0

  # ---------------------------------------------------------------
  # 瞄准 / 锁定
  # ---------------------------------------------------------------
  piercing_shot:
    display-name: "&a穿透射击"
    description: "&7瞄准射线上的敌人并造成伤害"
    type: ACTIVE
    trigger: LEFT_CLICK
    cooldown: 2.5
    mana-cost: 8
    icon: BOW
    skill-type: RAY_DAMAGE
    ray-distance: 20.0
    damage:
      base: 7.0
      scaling: 1.0
      armor-penetration: 0.2
